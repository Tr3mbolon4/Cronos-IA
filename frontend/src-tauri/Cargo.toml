[package]
name = "cronos-desktop"
version = "0.3.0"
description = "CRONOS Desktop"
authors = ["Kalion Tecnologia"]
edition = "2021"

[lib]
name = "cronos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
getrandom = "0.3"
sha2 = "0.10"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_Speech", "Win32_System_Com"] }
