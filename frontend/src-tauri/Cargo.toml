[package]
name = "cronos-desktop"
version = "0.1.0"
description = "CRONOS Desktop"
authors = ["CRONOS"]
edition = "2021"

[lib]
name = "cronos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
